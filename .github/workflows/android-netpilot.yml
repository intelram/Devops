name: android-netpilot

on:
  push:
    paths:
      - "android/netpilot/**"
      - ".github/workflows/android-netpilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/netpilot
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test
      - name: Lint and build debug APK
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: netpilot-debug-apk
          path: |
            android/netpilot/app/build/outputs/apk/debug/app-debug.apk
            android/netpilot/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: android/netpilot/app/build/reports/
